<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Private Kyrgyzstan tours, small-group trips, nomad culture experiences, horse riding, mountain trekking, and Silk Road routes with local planning."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="canonical" href="https://kyrgyz.tours/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta property="og:title" content="Go Kyrgyzstan Travel | Kyrgyzstan Tours & Private Trips" />
    <meta
      property="og:description"
      content="Plan private Kyrgyzstan tours, yurt stays, horse riding, mountain trekking, Issyk-Kul, Song-Kul, Ala-Archa, canyon lake views, and Silk Road routes."
    />
    <meta property="og:url" content="https://kyrgyz.tours/" />
    <meta property="og:site_name" content="Go Kyrgyzstan Travel" />
    <meta property="og:image" content="https://kyrgyz.tours/images/go-kyrgyzstan-hero.webp" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Go Kyrgyzstan Travel | Kyrgyzstan Tours & Private Trips</title>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('&');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      (function () {
        try {
          var preference = localStorage.getItem('go-kyrgyzstan-travel-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = preference === 'dark' || (preference === 'system' && systemDark) ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
