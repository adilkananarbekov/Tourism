<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#101311" />
    <link rel="canonical" href="https://kyrgyz.tours/" />
    <link rel="icon" href="%BASE_URL%brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%brand/kyrgyz-tours-apple-touch-icon.png" />

      rel="preload"

      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/lora-latin-600-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta property="og:title" content="Go Kyrgyzstan Travel | Kyrgyzstan Tours & Private Trips" />
    <meta
      property="og:description"
      content="Plan private Kyrgyzstan tours, yurt stays, horse riding, mountain trekking, Issyk-Kul, Song-Kul, Ala-Archa, canyon lake views, and Silk Road routes."
    />
    <meta property="og:url" content="https://kyrgyz.tours/" />
    <meta property="og:site_name" content="Go Kyrgyzstan Travel" />
    <meta property="og:image" content="https://kyrgyz.tours/images/travel-gallery-2026/travel-076-960.webp" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Go Kyrgyzstan Travel | Kyrgyzstan Tours & Private Trips</title>
    <script>
      document.documentElement.classList.add('js');
      window.setTimeout(function () {
        document.documentElement.classList.add('app-boot-timeout');
        var loadingPanel = document.querySelector('[data-initial-app-loading]');
        var errorPanel = document.querySelector('[data-initial-app-error]');
        if (loadingPanel) {
          loadingPanel.hidden = true;
        }
        if (errorPanel) {
          errorPanel.hidden = false;
          if (document.documentElement.lang === 'ru') {
            errorPanel.querySelector('[data-initial-app-error-title]').textContent = 'Страница загружается дольше обычного';
            errorPanel.querySelector('[data-initial-app-error-copy]').textContent = 'Проверьте соединение и попробуйте ещё раз или откройте упрощённую версию.';
            errorPanel.querySelector('[data-initial-app-retry]').textContent = 'Попробовать снова';
            errorPanel.querySelector('[data-initial-app-basic]').textContent = 'Открыть упрощённую версию';
          }
        }
      }, 8000);
    </script>
    <style>
      body {
        margin: 0;
      }

      [data-initial-app-shell] {
        display: none;
      }

      html.js:not(.app-ready):not(.app-basic-fallback) {
        overflow: hidden;
      }

      html.js [data-initial-app-shell] {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 10000;
        min-height: 100vh;
        min-height: 100svh;
        background: #fafaf8;
        color: #171a17;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      html.app-ready [data-initial-app-shell],
      html.app-basic-fallback [data-initial-app-shell] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      html.dark [data-initial-app-shell] {
        background: #101311;
        color: #f7f8f4;
      }

      .initial-app-shell__header {
        display: flex;
        min-height: 4rem;
        align-items: center;
        border-bottom: 1px solid #dde2dc;
        padding: 0 1.25rem;
      }

      html.dark .initial-app-shell__header {
        border-color: #343b35;
      }

      .initial-app-shell__brand {
        display: inline-flex;
        align-items: center;
      }

      .initial-app-shell__logo {
        display: block;
        width: 11.25rem;
        aspect-ratio: 3 / 1;
        background: center / contain no-repeat url('%BASE_URL%brand/kyrgyz-tours-logo-header-color.png');
      }

      html.dark .initial-app-shell__logo {
        background-image: url('%BASE_URL%brand/kyrgyz-tours-logo-horizontal-white.png');
      }

      .initial-app-shell__stage {
        display: grid;
        min-height: calc(100vh - 4rem);
        min-height: calc(100svh - 4rem);
        place-items: center;
        padding: 2rem 1.25rem;
        background: #fafaf8;
        box-sizing: border-box;
      }

      html.dark .initial-app-shell__stage {
        background: #101311;
      }

      .initial-app-shell__card {
        width: min(38rem, 100%);
      }

      [data-initial-app-error][hidden] {
        display: none;
      }

      .initial-app-shell__error {
        border: 1px solid #dde2dc;
        border-radius: 0.375rem;
        background: rgba(255, 255, 255, 0.82);
        padding: 1.5rem;
        box-shadow: 0 1rem 3rem rgba(16, 19, 17, 0.12);
        backdrop-filter: blur(12px);
      }

      html.dark .initial-app-shell__error {
        border-color: #343b35;
        background: rgba(23, 27, 24, 0.96);
      }

      .initial-app-shell__error h2 {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 1.8rem);
        line-height: 1.2;
      }

      .initial-app-shell__error p {
        margin: 0.75rem 0 0;
        color: #5b635d;
        line-height: 1.6;
      }

      html.dark .initial-app-shell__error p {
        color: #b5bdb6;
      }

      .initial-app-shell__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }

      .initial-app-shell__actions button {
        min-height: 2.75rem;
        border: 1px solid #1f6b4f;
        border-radius: 4px;
        padding: 0.6rem 1rem;
        background: #1f6b4f;
        color: #ffffff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      .initial-app-shell__actions button + button {
        background: transparent;
        color: #1f6b4f;
      }

      html.dark .initial-app-shell__actions button + button {
        color: #7ed4a8;
      }

      .initial-app-shell__actions button:focus-visible {
        outline: 3px solid rgba(31, 107, 79, 0.32);
        outline-offset: 3px;
      }

      .initial-app-shell__line,
      .initial-app-shell__button {
        display: block;
        border-radius: 999px;
        background: rgba(23, 26, 23, 0.13);
        animation: initial-shell-pulse 1.2s ease-in-out infinite alternate;
      }

      html.dark .initial-app-shell__line,
      html.dark .initial-app-shell__button {
        background: rgba(255, 255, 255, 0.13);
      }

      .initial-app-shell__line {
        height: 0.9rem;
        margin-bottom: 1rem;
      }

      .initial-app-shell__line--eyebrow {
        width: 7rem;
      }

      .initial-app-shell__line--title {
        width: 92%;
        height: 2.5rem;
      }

      .initial-app-shell__line--copy {
        width: 76%;
      }

      .initial-app-shell__button {
        width: 10rem;
        height: 3rem;
        margin-top: 1.75rem;
      }

      @keyframes initial-shell-pulse {
        from { opacity: 0.48; }
        to { opacity: 0.88; }
      }

      @media (prefers-reduced-motion: reduce) {
        html.js [data-initial-app-shell] {
          transition: none;
        }

        .initial-app-shell__line,
        .initial-app-shell__button {
          animation: none;
        }
      }
    </style>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('&');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      (function () {
        try {
          var preference = localStorage.getItem('go-kyrgyzstan-travel-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = preference === 'dark' || (preference === 'system' && systemDark) ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
    <script type="text/javascript">
      (function () {
        var recoveryKey = 'go-kyrgyzstan-travel-preload-recovery';

        function recoverFromStaleBundle(event) {
          var now = Date.now();
          var lastRecovery = 0;

          try {
            lastRecovery = Number(sessionStorage.getItem(recoveryKey) || 0);
          } catch (error) {
            lastRecovery = 0;
          }

          if (lastRecovery && now - lastRecovery < 30000) {
            return;
          }

          if (event && typeof event.preventDefault === 'function') {
            event.preventDefault();
          }

          try {
            sessionStorage.setItem(recoveryKey, String(now));
          } catch (error) {
            // A reload still repairs stale HTML when session storage is blocked.
          }

          window.location.reload();
        }

        window.addEventListener('vite:preloadError', recoverFromStaleBundle);
        window.addEventListener('load', function () {
          window.setTimeout(function () {
            try {
              sessionStorage.removeItem(recoveryKey);
            } catch (error) {
              // Nothing to clear when session storage is unavailable.
            }
          }, 10000);
        });
      })();
    </script>
  </head>
  <body>
    <div data-initial-app-shell data-nosnippet>
      <div class="initial-app-shell__header">
        <div class="initial-app-shell__brand">
          <span class="initial-app-shell__logo" role="img" aria-label="kyrgyz.tours"></span>
        </div>
      </div>
      <div class="initial-app-shell__stage">
        <div class="initial-app-shell__card">
          <div data-initial-app-loading role="status" aria-label="Loading page">
            <div aria-hidden="true">
              <span class="initial-app-shell__line initial-app-shell__line--eyebrow"></span>
              <span class="initial-app-shell__line initial-app-shell__line--title"></span>
              <span class="initial-app-shell__line initial-app-shell__line--copy"></span>
              <span class="initial-app-shell__line initial-app-shell__line--copy"></span>
              <span class="initial-app-shell__button"></span>
            </div>
          </div>
          <div class="initial-app-shell__error" data-initial-app-error role="alert" hidden>
            <h2 data-initial-app-error-title>Page is taking longer than usual</h2>
            <p data-initial-app-error-copy>Check your connection and try again, or open the basic version of this page.</p>
            <div class="initial-app-shell__actions">
              <button type="button" data-initial-app-retry>Try again</button>
              <button type="button" data-initial-app-basic>Open basic version</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      var appRoot = document.getElementById('root');
      appRoot.setAttribute('inert', '');
      appRoot.setAttribute('aria-busy', 'true');
      document.querySelector('[data-initial-app-retry]').addEventListener('click', function () {
        window.location.reload();
      });
      document.querySelector('[data-initial-app-basic]').addEventListener('click', function () {
        document.documentElement.classList.add('app-basic-fallback');
        appRoot.removeAttribute('inert');
        appRoot.removeAttribute('aria-busy');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
